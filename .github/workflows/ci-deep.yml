name: CI Deep
'on':
  push:
    branches:
    - main
  schedule:
  - cron: 29 1 * * *
  workflow_dispatch: null
env:
  PM_SENTRY_DISABLED: '1'
  PM_TELEMETRY_SOURCE_CONTEXT: test
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '2'
  NODE_OPTIONS: --network-family-autoselection-attempt-timeout=5000
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  PM_TEST_DEPTH: full
  PM_TEST_TIME_SCALE: '3'
permissions:
  contents: read
concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release-check:
    name: Deep release ${{ matrix.os }} ${{ matrix.runtime }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest') || matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          runtime: npm
        - os: ubuntu-latest
          runtime: bun
        - os: macos-latest
          runtime: npm
        - os: windows-latest
          runtime: npm
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
        cache-dependency-path: tests/oracle/package-lock.json
    - name: Set up pinned Rust tools
      uses: ./.github/actions/rust-setup
      with:
        coverage: 'true'
        quality: 'true'
    - name: Install hosted Bun
      if: matrix.runtime == 'bun' && runner.environment == 'github-hosted'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: latest
    - name: Install local job Bun
      if: matrix.runtime == 'bun' && runner.environment == 'self-hosted'
      env:
        BUN_INSTALL: ${{ runner.temp }}/bun
        SHELL: sh
      run: |-
        set -euo pipefail
        curl --fail --silent --show-error --location https://bun.sh/install | bash
        echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
    - name: Report Bun version
      if: matrix.runtime == 'bun'
      run: bun --version
    - name: Resolve the published CLI package root
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix tests/oracle --ignore-scripts
        oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
        echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
    - name: Install hosted syscall injection
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      run: |-
        sudo apt-get update
        sudo apt-get install --yes strace
    - name: Install local user-space syscall injection
      if: runner.os == 'Linux' && runner.environment == 'self-hosted'
      run: bash .github/scripts/setup-local-strace.sh
    - name: Run release:check aggregate gate
      run: ${{ matrix.runtime }} run release:check
    - name: Install clone-local pm merge drivers
      run: node tests/oracle/launch.mts merge install
    - name: Verify tracked pm project health
      run: node tests/oracle/launch.mts health --check-only --require-merge-drivers --strict-exit
  test:
    name: Deep full Rust Linux
    runs-on: ${{ vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
        cache-dependency-path: tests/oracle/package-lock.json
    - name: Set up pinned Rust tools
      uses: ./.github/actions/rust-setup
    - name: Resolve the published CLI package root
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix tests/oracle --ignore-scripts
        oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
        echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
    - name: Full Rust suite, original property counts
      run: cargo test --locked --all-targets --all-features
      env:
        PM_RUST_REQUIRE_PUBLISHED_CLI: '1'
  latency:
    name: Deep native latency ${{ matrix.os }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest') || matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Set up pinned Rust tools
      uses: ./.github/actions/rust-setup
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
        cache-dependency-path: tests/oracle/package-lock.json
    - name: Resolve the published CLI package root
      run: |
        set -euo pipefail
        npm ci --prefix tests/oracle --ignore-scripts
        oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
        echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
    - name: Build release binary
      run: cargo build --release --locked
    - name: Assert portable authoritative item-open budget
      run: cargo test --locked --lib workspace::tests::single_item_get
    - name: Assert 3000-item cold-process p95 latency
      run: node scripts/latency-gate.mts
