name: CodeQL
'on':
  push:
    branches:
    - main
    paths:
    - '**'
    - '!.agents/pm/**'
    - '!**/*.md'
    - '!docs/**'
    - '!Cargo.lock'
    - '!**/package-lock.json'
    - '!**/bun.lock'
    - '!**/bun.lockb'
    - .agents/pm/**/*.mjs
    - .agents/pm/**/*.cjs
    - .agents/pm/**/*.js
    - .agents/pm/**/*.ts
    - .agents/pm/**/*.mts
    - .agents/pm/**/*.rs
    - .agents/pm/**/*.sh
  pull_request:
    branches:
    - main
    paths:
    - '**'
    - '!.agents/pm/**'
    - '!**/*.md'
    - '!docs/**'
    - '!Cargo.lock'
    - '!**/package-lock.json'
    - '!**/bun.lock'
    - '!**/bun.lockb'
    - .agents/pm/**/*.mjs
    - .agents/pm/**/*.cjs
    - .agents/pm/**/*.js
    - .agents/pm/**/*.ts
    - .agents/pm/**/*.mts
    - .agents/pm/**/*.rs
    - .agents/pm/**/*.sh
  schedule:
  - cron: 17 4 * * 3
  workflow_dispatch: null
permissions:
  security-events: write
  contents: read
  actions: read
jobs:
  analyze:
    name: Analyze Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Rust 1.90
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: 1.90.0
        components: clippy,rustfmt
    - name: Build
      run: cargo build --locked --all-targets --all-features
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
      with:
        languages: rust
        build-mode: none
    - name: Analyze
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
      with:
        category: /language:rust
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
