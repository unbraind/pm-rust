name: Daily Release

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Lets the merge wait approve a CI run that GitHub parked on `action_required`
  # for the release PR. Best-effort: when the token may not approve, the run is
  # still reported with its URL so a maintainer can approve it once.
  actions: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    # New packages remain non-publishing until a maintainer explicitly enables
    # the repository variable. The daily trigger is ready without turning a
    # merge into implicit approval to publish a new crate. This mirrors the
    # guard pattern from unbraind/pm-rl.
    if: vars.PM_RELEASE_APPROVED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_TIMEZONE: Europe/Vienna
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90.0"
          components: clippy,rustfmt

      - name: Install just
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          # This job runs `just release-check`, which needs the whole gate
          # toolchain — not just `just`. Installing only `just` here made the
          # release fail inside the gate rather than before it.
          tool: just,cargo-llvm-cov,cargo-audit

      # `just release-check` measures branch coverage with
      # `cargo +nightly-2026-08-06 llvm-cov --branch`, so the pinned nightly and
      # llvm-tools-preview must be present alongside the stable 1.90 toolchain.
      - name: Install nightly Rust for branch instrumentation
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "nightly-2026-08-06"
          components: llvm-tools-preview

      - name: Install Node.js for pm-changelog
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Decide release
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          latest_tag="$(git tag --sort=-creatordate | head -n 1 || true)"
          if [[ -n "$latest_tag" ]] && git diff --quiet "$latest_tag"..HEAD -- .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
            echo "No changes since $latest_tag; skipping release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          release_date="$(TZ="$RELEASE_TIMEZONE" date +%Y.%m.%d)"
          base_tag="v${release_date}"
          max_suffix=-1
          while IFS= read -r existing_tag; do
            if [[ "$existing_tag" == "$base_tag" ]]; then
              (( max_suffix < 0 )) && max_suffix=0
              continue
            fi
            if [[ "$existing_tag" == "$base_tag-"* ]]; then
              suffix="${existing_tag#"$base_tag-"}"
              if [[ "$suffix" =~ ^[0-9]+$ ]] && (( suffix > max_suffix )); then
                max_suffix="$suffix"
              fi
            fi
          done < <(git tag -l "${base_tag}*")

          if (( max_suffix >= 0 )); then
            tag="${base_tag}-$((max_suffix + 1))"
          else
            tag="${base_tag}"
          fi

          # The heading date is derived from the version the tag encodes,
          # not from the clock, so a release can never publish a version whose
          # changelog heading names a different day than the version itself.
          version_core="${tag#v}"
          year="${version_core%%.*}"
          version_tail="${version_core#*.}"
          month="${version_tail%%.*}"
          day_and_suffix="${version_tail#*.}"
          day="${day_and_suffix%%-*}"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf 'release_iso_date=%04d-%02d-%02d\n' "$((10#$year))" "$((10#$month))" "$((10#$day))" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp crate version in Cargo.toml
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Parse the manifest properly and write the version back.
          # Never pattern-match a bare `version:` across files — this has
          # corrupted a release before.
          tag="${{ steps.decide.outputs.tag }}"
          version="${tag#v}"
          # The git tag is zero-padded (date +%Y.%m.%d gives 2026.08.08), but
          # Cargo rejects leading zeroes in numeric version fields outright:
          #   error: invalid leading zero in minor version number
          # So the tag keeps its padding and the CRATE version strips it,
          # 2026.08.08 -> 2026.8.8. A `-N` disambiguating suffix is preserved.
          version="$(printf '%s' "$version" | awk -F- '{
            n = split($1, p, ".");
            for (i = 1; i <= n; i++) { p[i] = p[i] + 0; }
            out = p[1];
            for (i = 2; i <= n; i++) { out = out "." p[i]; }
            if (NF > 1) { sub(/^[^-]*-/, "", $0); out = out "-" $0; }
            print out;
          }')"
          node -e "
            const fs = require('node:fs');
            const toml = fs.readFileSync('Cargo.toml', 'utf8');
            const updated = toml.replace(
              /^version\s*=\s*\"[^\"]*\"/m,
              'version = \"' + process.argv[1] + '\"'
            );
            if (updated === toml) {
              console.error('Could not find version field in Cargo.toml');
              process.exit(1);
            }
            fs.writeFileSync('Cargo.toml', updated);
          " "$version"

      - name: Generate changelog and release notes
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_date="${{ steps.decide.outputs.release_iso_date }}"
          crate_version="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' Cargo.toml)"
          npx --yes --package=pm-changelog@2026.8.6 -- pm-changelog \
            --pm-root .agents/pm \
            --mode replace \
            --output CHANGELOG.md \
            --all-release-tags \
            --release-version "$crate_version" \
            --date "$release_date" \
            --item-url-base https://github.com/unbraind/pm-rust/blob/main/.agents/pm \
            --respect-item-release \
            --conventional \
            --include-links \
            --item-ref-style toon \
            --include-metadata \
            --github-step-summary
          npx --yes --package=pm-changelog@2026.8.6 -- pm-changelog \
            --pm-root .agents/pm \
            --mode replace \
            --output CHANGELOG.md \
            --all-release-tags \
            --release-version "$crate_version" \
            --date "$release_date" \
            --item-url-base https://github.com/unbraind/pm-rust/blob/main/.agents/pm \
            --respect-item-release \
            --conventional \
            --include-links \
            --item-ref-style toon \
            --include-metadata \
            --check
          npx --yes --package=pm-changelog@2026.8.6 -- pm-changelog \
            --pm-root .agents/pm \
            --stdout \
            --release-version "$crate_version" \
            --date "$release_date" \
            --since-previous-tag \
            --until-release-tag \
            --item-url-base https://github.com/unbraind/pm-rust/blob/main/.agents/pm \
            --respect-item-release \
            --conventional \
            --include-links \
            --item-ref-style toon \
            --include-metadata \
            > RELEASE_NOTES.md

      - name: Run release checks
        if: steps.decide.outputs.should_release == 'true'
        # release-check ends in changelog-check, which regenerates and compares.
        # It must use the same date the generate step above stamped into the
        # heading, otherwise it rejects the changelog this job just produced on
        # every day that is not the justfile's hardcoded CHANGELOG_DATE.
        run: just CHANGELOG_DATE="${{ steps.decide.outputs.release_iso_date }}" release-check

      - name: Commit release files
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Release files are already current; tagging existing commit."
          else
            git commit -m "Release ${{ github.event.repository.name }} ${{ steps.decide.outputs.tag }}"
          fi

      # Refuse non-main release runs BEFORE publishing. Checking the trigger
      # ref (rather than git topology) reliably distinguishes a feature branch
      # from main.
      - name: Check release ref
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Refusing to release from non-main ref ('$GITHUB_REF')."
            exit 1
          fi

      # Persist validated release metadata through the repository's protected
      # branch policy before tagging. A stable branch name lets a failed run
      # update/reuse its open release PR, while the exact remote SHA lease
      # prevents overwriting another actor's work. main is protected across
      # the fleet (required checks, enforce_admins, required_conversation
      # resolution), so a direct `git push origin HEAD:main` is rejected with
      # GH006 and `set -e` kills the job before the tag push — exactly the
      # failure that killed every daily release in the fleet on 2026-08-10.
      #
      # The merge wait below does NOT poll `mergeStateStatus` to decide the
      # merge — that is the deadlock this fixes. Instead it resolves any
      # unresolved review threads (required_conversation_resolution is on, so
      # an advisory bot comment would otherwise block the release forever),
      # then simply calls the merge endpoint. A successful PUT is proof the
      # branch-protection rules were satisfied — no inference needed; a failed
      # PUT (405 = checks not ready, 409 = SHA moved) is proof they were not,
      # and is retried until the deadline. mergeStateStatus is read only to
      # detect the fatal DIRTY/BEHIND states and to keep the deadline message
      # diagnosable; the merge DECISION is never derived from it.
      #
      # The required-check list itself cannot be read here:
      # /branches/main/protection/required_status_checks is
      # administration-scoped, and the built-in GITHUB_TOKEN has no
      # administration permission. The merge attempt sidesteps that entirely:
      # GitHub evaluates the full protection rule set server-side and either
      # accepts or refuses the merge.
      - name: Merge release metadata through protected PR
        if: steps.decide.outputs.should_release == 'true'
        id: release_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_SHA: ${{ steps.decide.outputs.base_sha }}
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          current_main_sha="$(git rev-parse origin/main)"
          if [[ "$current_main_sha" != "$RELEASE_BASE_SHA" ]]; then
            echo "::error::main advanced from ${RELEASE_BASE_SHA} to ${current_main_sha} while preparing the release. Retry from the new main head."
            exit 1
          fi

          release_branch="release/${RELEASE_TAG#v}"
          release_commit="$(git rev-parse HEAD)"
          if [[ "$release_commit" == "$current_main_sha" ]]; then
            echo "Release metadata is already present on main; resuming the tag transaction."
            if git ls-remote --exit-code --heads origin "refs/heads/${release_branch}" > /dev/null 2>&1; then
              git push origin --delete "$release_branch"
            fi
            {
              echo "merged_sha=$current_main_sha"
              echo "pr_number="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_branch_sha="$(git ls-remote --heads origin "refs/heads/${release_branch}" | cut -f1)"
          if [[ -n "$remote_branch_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${release_branch}:${remote_branch_sha}" \
              origin "HEAD:refs/heads/${release_branch}"
          else
            git push origin "HEAD:refs/heads/${release_branch}"
          fi

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$release_branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$release_branch" \
              --title "Release pm-rust ${RELEASE_TAG}" \
              --body "Automated daily release metadata for \`${RELEASE_TAG}\`. The release gate passed before this PR was created; tagging remains blocked until this protected PR is merged.")"
            pr_number="${pr_url##*/}"
          fi

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          deadline=$(( SECONDS + 1800 ))
          awaiting_approval=0
          merge_err="$(mktemp)"
          pr_view_err="$(mktemp)"
          merged_sha=""
          while :; do
            pr_state="$(gh pr view "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json mergeStateStatus,statusCheckRollup \
              --jq '{merge_state: (.mergeStateStatus // "UNKNOWN"),
                     unsettled: [.statusCheckRollup[]?
                                 | {name: (.name // .context),
                                    state: (.conclusion // .state // .status // "PENDING")}
                                 | select((.state | IN("SUCCESS", "NEUTRAL", "SKIPPED",
                                                       "FAILURE", "ERROR", "TIMED_OUT",
                                                       "CANCELLED", "ACTION_REQUIRED",
                                                       "STARTUP_FAILURE", "STALE")) | not)
                                 | .name],
                     failing: [.statusCheckRollup[]?
                               | {name: (.name // .context),
                                  state: (.conclusion // .state // .status // "PENDING")}
                               | select(.state | IN("FAILURE", "ERROR", "TIMED_OUT",
                                                    "CANCELLED", "ACTION_REQUIRED",
                                                    "STARTUP_FAILURE", "STALE"))
                               | .name]}' 2>"$pr_view_err")" || pr_state=""
            if [[ -z "$pr_state" ]]; then
              echo "Could not read PR #${pr_number} (retrying): $(tr '\n' ' ' < "$pr_view_err")"
              merge_state="UNKNOWN"
              unsettled="github api unavailable"
              failing=""
            else
              merge_state="$(jq -r '.merge_state' <<< "$pr_state")"
              unsettled="$(jq -r '.unsettled | join(", ")' <<< "$pr_state")"
              failing="$(jq -r '.failing | join(", ")' <<< "$pr_state")"
            fi

            case "$merge_state" in
              DIRTY | BEHIND)
                echo "::error::Release PR #${pr_number} is ${merge_state}; it conflicts with main or its base moved. Retry the release from the new main head."
                exit 1
                ;;
            esac

            # required_conversation_resolution is enabled, so any unresolved
            # review thread blocks the merge forever. Advisory bot reviewers
            # routinely open threads as a confidence signal; resolve every
            # unresolved thread on this release PR before each attempt so a
            # bot comment cannot dead-end the daily release.
            unresolved="$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{id isResolved}}}}}' \
              -F o="$owner" -F r="$repo" -F n="$pr_number" \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[]? | select(.isResolved==false) | .id' 2>/dev/null || true)"
            if [[ -n "$unresolved" ]]; then
              while IFS= read -r thread_id; do
                [[ -z "$thread_id" ]] && continue
                gh api graphql \
                  -f query='mutation($t:ID!){resolveReviewThread(input:{threadId:$t}){thread{isResolved}}}' \
                  -F t="$thread_id" >/dev/null 2>&1 || true
              done <<< "$unresolved"
            fi

            # Attempt the merge and let GitHub be the authority. A successful
            # PUT is proof the branch-protection rules were satisfied; a
            # failure (405 = checks not ready, 409 = SHA moved) is proof they
            # were not. No state inference in between.
            merge_out="$(gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
              -f merge_method=rebase \
              -f sha="$release_commit" \
              2>"$merge_err")" && merge_rc=0 || merge_rc=$?
            if (( merge_rc == 0 )); then
              merged_sha="$(jq -r '.sha // empty' <<< "$merge_out" 2>/dev/null || true)"
              if [[ -n "$merged_sha" && "$merged_sha" != "null" ]]; then
                echo "Merged release PR #${pr_number} via merge API (state was ${merge_state})."
                break
              fi
              echo "Merge returned no sha; retrying: $(tr '\n' ' ' < "$merge_err")"
              merged_sha=""
            else
              echo "Merge attempt refused (state: ${merge_state}; settling: ${unsettled:-none}; failing: ${failing:-none}): $(tr '\n' ' ' < "$merge_err")"

              # A run parked on `action_required` is awaiting manual approval
              # and will never start on its own. It is invisible in
              # statusCheckRollup, so without this it is indistinguishable
              # from a required check that failed: the loop just logs
              # "settling: none" until the deadline. Try to approve it — the
              # token often may not, which is harmless — and always surface
              # the run so the wait is diagnosable.
              pending_runs="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${release_commit}" \
                --jq '.workflow_runs[]? | select(.conclusion=="action_required" or .status=="waiting") | .id' \
                2>/dev/null || true)"
              if [[ -n "$pending_runs" ]]; then
                while IFS= read -r run_id; do
                  [[ -z "$run_id" ]] && continue
                  echo "::warning::CI run ${run_id} for this release PR is awaiting workflow approval: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                  gh api --method POST \
                    "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" \
                    >/dev/null 2>&1 \
                    && echo "Approved workflow run ${run_id}; its checks can now report." \
                    || echo "Could not approve run ${run_id} with this token; a maintainer must approve it once."
                done <<< "$pending_runs"
                awaiting_approval=1
              fi
            fi

            if (( SECONDS >= deadline )); then
              if (( awaiting_approval == 1 )); then
                echo "::error::Release PR #${pr_number} did not merge within 30 minutes because its CI run is awaiting workflow approval (last state: ${merge_state}). Approve the run linked above once; this repository requires approval for a contributor that has no merged PR yet. Nothing was tagged."
              else
                echo "::error::Release PR #${pr_number} did not merge within 30 minutes (last state: ${merge_state}; still settling: ${unsettled:-none}; failing: ${failing:-none}). A required check failed or never reported, or a required review is missing; not merging or tagging."
              fi
              exit 1
            fi
            sleep 20
          done
          rm -f "$merge_err" "$pr_view_err"

          if [[ -z "$merged_sha" || "$merged_sha" == "null" ]]; then
            echo "::error::GitHub did not return the merged main SHA for release PR #${pr_number}."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/${release_branch}" > /dev/null 2>&1; then
            git push origin --delete "$release_branch"
          fi
          {
            echo "merged_sha=$merged_sha"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"
          echo "Merged release metadata PR #${pr_number} at ${merged_sha}." >> "$GITHUB_STEP_SUMMARY"

      # The release PR can only contain the prepared release commit because
      # the base SHA is checked immediately before creation. Re-check the
      # exact merged main commit anyway so the tag always lands on
      # byte-for-byte validated repository state, and fail safely before
      # tagging if main moved. The version comparison uses the Cargo form
      # (leading zeroes stripped: 2026.08.10 -> 2026.8.10), not the tag form,
      # because Cargo rejects leading zeroes in version fields — the same
      # conversion the Stamp crate version step performs.
      - name: Verify merged release
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          MERGED_SHA: ${{ steps.release_pr.outputs.merged_sha }}
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
          RELEASE_ISO_DATE: ${{ steps.decide.outputs.release_iso_date }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          git checkout --detach origin/main
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$MERGED_SHA" ]]; then
            echo "::error::main advanced from merged release ${MERGED_SHA} to ${actual_sha} before tagging. Retry to rebuild release metadata on the new head."
            exit 1
          fi

          # Derive the expected Cargo version from the tag by stripping
          # leading zeroes, exactly as the Stamp crate version step does.
          # The tag keeps its zero-padded date form (v2026.08.10) while the
          # crate version strips it (2026.8.10); comparing the tag form
          # would always fail.
          expected_version="${RELEASE_TAG#v}"
          expected_version="$(printf '%s' "$expected_version" | awk -F- '{
            n = split($1, p, ".");
            for (i = 1; i <= n; i++) { p[i] = p[i] + 0; }
            out = p[1];
            for (i = 2; i <= n; i++) { out = out "." p[i]; }
            if (NF > 1) { sub(/^[^-]*-/, "", $0); out = out "-" $0; }
            print out;
          }')"
          actual_version="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' Cargo.toml)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Merged crate version ${actual_version} does not match intended release ${expected_version} (tag ${RELEASE_TAG})."
            exit 1
          fi

          just CHANGELOG_DATE="${RELEASE_ISO_DATE}" release-check
          git diff --exit-code -- Cargo.toml Cargo.lock CHANGELOG.md

      # Tag the exact merged/verified main commit. main is already advanced
      # by the protected-PR merge above, so this step only creates and pushes
      # the tag — it never pushes HEAD:main again (that push was what branch
      # protection rejected with GH006, killing the job before the tag push
      # in the old ordering). pm-rust has no publish step, so there is no
      # crate-registry drift to worry about — the release simply could not
      # complete because the push to main died before the tag push.
      - name: Push release tag
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          # Consult the remote, not just the local tag database. The last tag
          # fetch happened back in `Decide release`; if anything created this
          # tag on origin since then, the local lookup misses it, `git tag`
          # succeeds locally and the push below is rejected as non-fast-forward
          # - after a successful publish, which is the npm-ahead-of-git state
          # this workflow exists to prevent.
          git fetch origin --force --tags
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${release_tag}" | cut -f1)"
          current_sha="$(git rev-parse HEAD)"
          if [[ -n "$remote_tag_sha" ]]; then
            remote_commit="$(git rev-list -n 1 "$remote_tag_sha")"
            if [[ "$remote_commit" != "$current_sha" ]]; then
              echo "::error::${release_tag} already exists on origin at ${remote_commit}, not verified main ${current_sha}."
              exit 1
            fi
            echo "::notice::${release_tag} is already on origin at the verified commit; nothing to push."
            exit 0
          fi
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" > /dev/null; then
            existing_sha="$(git rev-list -n 1 "$release_tag")"
            current_sha="$(git rev-parse HEAD)"
            if [[ "$existing_sha" != "$current_sha" ]]; then
              echo "::error::${release_tag} already points to ${existing_sha}, not verified main ${current_sha}."
              exit 1
            fi
          else
            git tag "$release_tag"
          fi
          git push origin "refs/tags/${release_tag}"

      - name: Create GitHub release
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.decide.outputs.tag }}" --title "${{ github.event.repository.name }} ${{ steps.decide.outputs.tag }}" --notes-file RELEASE_NOTES.md --verify-tag