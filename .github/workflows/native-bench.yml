name: Native hot-path benchmark

on:
  pull_request:
    paths:
      - .github/workflows/native-bench.yml
      - scripts/native-bench.mts
      - scripts/bench-oracle.mts
      - scripts/bench-report.mts
      - scripts/perf-revert-proof.mts
      - tests/bench-oracle/**
      - src/**
      - Cargo.lock
      - Cargo.toml
      - justfile
  workflow_dispatch:

permissions:
  contents: read

env:
  PM_SENTRY_DISABLED: "1"
  PM_TELEMETRY_SOURCE_CONTEXT: test
  BENCH_BASE_SHA: 8e32f851504c4169704d3af3cec4b91420c9d33c
  BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: native-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revert-proof:
    if: github.head_ref == 'perf/native-hot-paths' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90.0"
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Prove both regressions fail with behavior reverted
        run: node scripts/perf-revert-proof.mts
      - name: Retain assertion and source-restoration receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-hot-path-revert-proof
          path: target/native-revert-proof.json
          if-no-files-found: error
          retention-days: 30
  benchmark:
    if: github.head_ref == 'perf/native-hot-paths' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90.0"
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install just
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just
      - name: Require resource-accounting tools
        run: |
          set -euo pipefail
          test -x /usr/bin/time
          if ! command -v strace; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends strace
          fi
      - name: Build immutable before binary
        run: |
          set -euo pipefail
          mkdir -p target
          git worktree add --detach target/bench-baseline "$BENCH_BASE_SHA"
          cargo +1.90.0 build --manifest-path target/bench-baseline/Cargo.toml --target-dir target/bench-build-before --release --locked
          mkdir -p target/before
          cp target/bench-build-before/release/pm-rust target/before/pm-rust
      - name: Measure the full paired matrix
        run: |
          set -euo pipefail
          just bench --baseline target/before/pm-rust --profile yes --output target/native-bench.json
          node scripts/bench-report.mts target/native-bench.json target/native-bench.md
          cat target/native-bench.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain synthetic measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-hot-path-measurements
          path: |
            target/native-bench.json
            target/native-bench.md
          if-no-files-found: warn
          retention-days: 30
