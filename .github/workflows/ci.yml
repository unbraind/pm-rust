name: CI
'on':
  pull_request: null
  workflow_dispatch: null
env:
  PM_SENTRY_DISABLED: '1'
  PM_TELEMETRY_SOURCE_CONTEXT: test
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '2'
  NODE_OPTIONS: --network-family-autoselection-attempt-timeout=5000
  PM_TEST_DEPTH: quick
  PROPTEST_CASES: '50'
  PROPTEST_RNG_SEED: '20261116'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Detect code changes
      id: changes
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        code=true
        if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
          code=false
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              # Executable tracker files use the same code tier in every package.
              .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.ts|.agents/pm/*.rs|.agents/pm/*.sh|.agents/pm/*.mts) code=true ;;
              .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/ci-changed-paths"
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
  policy:
    name: Tracker, identity and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
        cache-dependency-path: tests/oracle/package-lock.json
    - name: Resolve the published CLI package root
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix tests/oracle --ignore-scripts
        oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
        echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
    - name: Install clone-local pm merge drivers
      run: node tests/oracle/launch.mts merge install
    - name: Verify tracked pm project health
      run: node tests/oracle/launch.mts health --check-only --require-merge-drivers --strict-exit
    - name: Changelog and all-object identity gates
      run: |-
        node scripts/changelog.mts full --check
        node scripts/ci-identity.mts
    - name: Documentation and public evidence contracts
      run: |-
        node --test --test-name-pattern='README|orientation documentation|reproduction identity|reports reject empty|historical order|runner wording|documented latency|clock disclosure|review receipt|TOON output parses|retained replay guidance' scripts/harness.test.mts scripts/crash-harness.test.mts scripts/crash-review.test.mts
        node scripts/crash-history-prefix.mts
        node scripts/crash-evidence-commits.mts
        node --test scripts/crash-ci-contract.test.mts
  rust-shard:
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
        cache-dependency-path: tests/oracle/package-lock.json
      if: needs.changes.outputs.code == 'true'
    - name: Set up pinned Rust tools
      uses: ./.github/actions/rust-setup
      if: needs.changes.outputs.code == 'true'
    - name: Resolve the published CLI package root
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix tests/oracle --ignore-scripts
        oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
        echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
      if: needs.changes.outputs.code == 'true'
    - name: Build and test quick target shard
      run: node scripts/ci-targets.mts ${{ matrix.shard }}
      env:
        PM_RUST_REQUIRE_PUBLISHED_CLI: '1'
      if: needs.changes.outputs.code == 'true'
    name: Quick Rust ${{ matrix.os }} shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        shard:
        - 1
        - 2
  test:
    name: Rust ${{ matrix.os }}
    needs:
    - rust-shard
    - policy
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - name: Require every platform shard and policy gate
      env:
        SHARDS: ${{ needs.rust-shard.result }}
        POLICY: ${{ needs.policy.result }}
      run: test "$SHARDS" = success && test "$POLICY" = success
  release-check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
        cache-dependency-path: tests/oracle/package-lock.json
      if: needs.changes.outputs.code == 'true'
    - name: Set up pinned Rust tools
      uses: ./.github/actions/rust-setup
      with:
        quality: 'true'
      if: needs.changes.outputs.code == 'true'
    - name: Resolve the published CLI package root
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix tests/oracle --ignore-scripts
        oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
        echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
      if: needs.changes.outputs.code == 'true'
    - name: Format
      run: cargo fmt --all -- --check
      if: needs.changes.outputs.code == 'true'
    - name: Clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
      if: needs.changes.outputs.code == 'true'
    - name: Complete private source documentation
      env:
        RUSTDOCFLAGS: --document-private-items -D missing-docs
      run: cargo doc --locked --all-features --no-deps
      if: needs.changes.outputs.code == 'true'
    - name: Production Rust security audit
      run: cargo audit
      if: needs.changes.outputs.code == 'true'
    name: Quick release quality
  coverage-shard:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
        cache-dependency-path: tests/oracle/package-lock.json
      if: needs.changes.outputs.code == 'true'
    - name: Set up pinned Rust tools
      uses: ./.github/actions/rust-setup
      with:
        coverage: 'true'
      if: needs.changes.outputs.code == 'true'
    - name: Resolve the published CLI package root
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix tests/oracle --ignore-scripts
        oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
        echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
      if: needs.changes.outputs.code == 'true'
    - name: Quick instrumented target shard
      if: needs.changes.outputs.code == 'true'
      run: node scripts/ci-targets.mts ${{ matrix.shard }} --coverage
      env:
        PM_RUST_REQUIRE_PUBLISHED_CLI: '1'
    - name: Collect original per-process hits
      if: needs.changes.outputs.code == 'true'
      run: node scripts/ci-coverage-profiles.mts collect ${{ matrix.shard }}
    - name: Upload original profiles
      if: needs.changes.outputs.code == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: rust-coverage-${{ matrix.shard }}
        path: target/ci-coverage/${{ matrix.shard }}
        if-no-files-found: error
        retention-days: 1
        compression-level: 1
    name: Quick coverage shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
  coverage:
    needs:
    - changes
    - coverage-shard
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
        cache-dependency-path: tests/oracle/package-lock.json
      if: needs.changes.outputs.code == 'true'
    - name: Set up pinned Rust tools
      uses: ./.github/actions/rust-setup
      with:
        coverage: 'true'
      if: needs.changes.outputs.code == 'true'
    - name: Resolve the published CLI package root
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix tests/oracle --ignore-scripts
        oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
        echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
      if: needs.changes.outputs.code == 'true'
    - name: Download both original-profile artifacts
      if: needs.changes.outputs.code == 'true'
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        pattern: rust-coverage-*
        path: target/coverage-download
    - name: Rebuild complete instrumented mapping without running tests
      if: needs.changes.outputs.code == 'true'
      run: |-
        cargo +nightly-2026-08-06 llvm-cov --no-report --locked --branch --all-targets --all-features -- --list > "$RUNNER_TEMP/coverage-target-list"
        cargo +nightly-2026-08-06 llvm-cov clean --profraw-only
    - name: Prove exact union and unchanged thresholds with native fixtures
      if: needs.changes.outputs.code == 'true'
      env:
        PM_TEST_COVERAGE_MERGE: required
      run: node --test scripts/crash-coverage-union.test.mts
    - name: Restore verified shard hits only
      if: needs.changes.outputs.code == 'true'
      run: node scripts/ci-coverage-profiles.mts restore
    - name: Quick coverage at unchanged four-dimension thresholds
      run: |-
        cargo +nightly-2026-08-06 llvm-cov report --json --failure-mode=any --output-path coverage-branch.json
        jq '.data[0].totals' coverage-branch.json
        jq -e '.data[0].totals.lines.percent == 100 and .data[0].totals.functions.percent == 100 and .data[0].totals.regions.percent == 100 and .data[0].totals.branches.percent == 100' coverage-branch.json
      env:
        PM_RUST_REQUIRE_PUBLISHED_CLI: '1'
      if: needs.changes.outputs.code == 'true'
    name: Quick exact coverage union
  crash-check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
        cache-dependency-path: tests/oracle/package-lock.json
      if: needs.changes.outputs.code == 'true'
    - name: Set up pinned Rust tools
      uses: ./.github/actions/rust-setup
      if: needs.changes.outputs.code == 'true'
    - name: Resolve the published CLI package root
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix tests/oracle --ignore-scripts
        oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
        echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
      if: needs.changes.outputs.code == 'true'
    - name: Install syscall injection
      run: |-
        sudo apt-get update
        sudo apt-get install --yes strace
      if: needs.changes.outputs.code == 'true'
    - name: Build native binary
      run: cargo build --locked
      if: needs.changes.outputs.code == 'true'
    - name: Quick typed crash and adapter harness
      run: just crash-check
      if: needs.changes.outputs.code == 'true'
    name: Quick crash harness
  release-aggregate:
    name: Release gate aggregate
    needs:
    - policy
    - release-check
    - coverage
    - crash-check
    - rust-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require every release component
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: node --input-type=module -e 'const jobs=JSON.parse(process.env.RESULTS); if(!Object.values(jobs).every(job=>job.result==="success")) { console.error(jobs); process.exit(1);
        }'
