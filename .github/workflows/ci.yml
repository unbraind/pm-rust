name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90.0"
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  coverage-and-governance:
    name: Coverage, security, and pm health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust for branch instrumentation
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly-2026-08-06
          components: llvm-tools-preview
      - name: Install Node.js for the canonical pm health gate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Install Rust quality tools
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2
        with:
          tool: cargo-audit,cargo-llvm-cov
      - run: cargo +nightly-2026-08-06 llvm-cov --locked --branch --all-targets --all-features --json --output-path coverage-branch.json
      - name: Enforce 100 percent coverage
        run: jq -e '.data[0].totals.lines.percent == 100 and .data[0].totals.functions.percent == 100 and .data[0].totals.regions.percent == 100 and .data[0].totals.branches.percent == 100' coverage-branch.json
      - run: cargo audit
      - name: Verify generated changelog
        run: npx --yes --package=pm-changelog@2026.8.6 -- pm-changelog --pm-root .agents/pm --check --status in_progress --version Unreleased --conventional --include-links --item-url-base https://github.com/unbraind/pm-rust/blob/main/.agents/pm --item-ref-style toon --include-metadata
      - name: Verify tracked pm project health
        run: npm exec --yes --package=@unbrained/pm-cli@2026.8.6 -- pm health --strict-exit
