name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# All published tooling runs in the test telemetry context.
env:
  PM_SENTRY_DISABLED: "1"
  PM_TELEMETRY_SOURCE_CONTEXT: test

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust ${{ matrix.os }}
    # NOTE: the checkout below is deliberately full-depth. tests/identity_audit.rs
    # runs under `cargo test` and walks reachable AND unreachable objects; on a
    # depth-1 clone there is almost nothing to walk, so the audit would pass
    # vacuously and report a clean history it never actually inspected.
    runs-on: ${{ matrix.os }}
    # Both Ubuntu and Windows passed tests but exhausted 15 minutes during cleanup.
    # Allow the same bounded setup/test/cleanup window on every matrix runner.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90.0"
          components: clippy,rustfmt
      - name: Install just for the oracle recipe contract
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Enforce complete source documentation
        env:
          RUSTDOCFLAGS: --document-private-items -D missing-docs
        run: cargo doc --locked --all-features --no-deps
      # NOTE: the differential suites (conformance_differential, branch_merge_contract)
      # compare this implementation byte-for-byte against the published Node CLI, and
      # they degrade to a printed skip when none is reachable. Without Node here they
      # skipped on every run, so the conformance claim was green and unverified — the
      # same vacuous-pass shape as the full-depth checkout note above.
      # PM_RUST_REQUIRE_PUBLISHED_CLI turns a missing CLI into a failure, so these
      # cannot silently stop running again.
      - name: Install the published pm CLI for the differential suites
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Resolve the published CLI package root
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/oracle --ignore-scripts
          oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
          echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
      - run: cargo test --locked --all-targets --all-features
        env:
          PM_RUST_REQUIRE_PUBLISHED_CLI: "1"

  latency:
    name: Native latency ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90.0"
      - name: Install Node.js for the latency harness
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Resolve the published CLI package root
        run: |
          set -euo pipefail
          npm ci --prefix tests/oracle --ignore-scripts
          oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
          echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release --locked
      - name: Assert portable authoritative item-open budget
        run: cargo test --locked --lib workspace::tests::single_item_get
      - name: Assert 3000-item cold-process p95 latency
        run: node scripts/latency-gate.mts

  release-check:
    name: ${{ matrix.gate }}
    runs-on: ${{ matrix.os }}
    # Every runner needs both complete oracle test passes, audit and tracker health.
    # The orientation matrix exceeded the former Unix 20-minute budget.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gate: Release gate aggregate
            runtime: npm
          - os: macos-latest
            gate: Release gate aggregate macos-latest
            runtime: npm
          - os: windows-latest
            gate: Release gate aggregate windows-latest
            runtime: npm
          - os: ubuntu-latest
            gate: Release gate aggregate bun
            runtime: bun
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `just changelog-check` runs pm-changelog with --all-release-tags,
          # which derives its release window from the git tag refs. The default
          # shallow checkout carries none, so the gate fails with
          # E_MISSING_TAG_HISTORY even when the committed changelog is correct.
          # The identity audit needs the full object graph for the same reason:
          # it walks unreachable objects, which a depth-1 clone does not fetch.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.90.0"
          components: clippy,rustfmt
      - name: Install nightly Rust for branch instrumentation
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly-2026-08-06
          components: llvm-tools-preview
      - name: Install Node.js for pm-changelog and pm health
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install Rust quality tools and just
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit,cargo-llvm-cov,just

      # The release:check aggregate: fmt, clippy (deny warnings), docstring
      # gate, full test suite, coverage at 100 percent, security audit, and
      # timezone-stable changelog check — all in one command.
      # release-check runs the differential suites, which skip when no published
      # CLI is discoverable. Installing it here is what makes the release gate
      # actually compare against the published CLI instead of passing over a skip.
      - name: Resolve the published CLI package root
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/oracle --ignore-scripts
          oracle_root=$(node -p "require('node:path').resolve('tests/oracle/node_modules/@unbrained/pm-cli')")
          echo "PM_NODE_CLI=$oracle_root" >> "$GITHUB_ENV"
      - name: Install Bun for the Bun aggregate
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install syscall injection for the Linux crash corpus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Run release:check aggregate gate
        run: ${{ matrix.runtime }} run release:check

      - name: Install clone-local pm merge drivers
        run: node tests/oracle/launch.mts merge install
      - name: Verify tracked pm project health
        run: node tests/oracle/launch.mts health --check-only --require-merge-drivers --strict-exit
