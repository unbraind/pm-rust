name: Rust CI setup
description: Pinned hosted tools or locked persistent user-space Rust on local runners
inputs:
  coverage:
    description: Install branch-coverage toolchain and tool
    default: 'false'
  quality:
    description: Install security audit tool
    default: 'false'
runs:
  using: composite
  steps:
    - name: Bootstrap persistent local Rust
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        COVERAGE: ${{ inputs.coverage }}
        QUALITY: ${{ inputs.quality }}
      run: bash .github/scripts/setup-local-rust.sh
    - name: Install Rust 1.90
      if: runner.environment == 'github-hosted'
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: '1.90.0'
        components: clippy,rustfmt
    - name: Install nightly Rust for branch instrumentation
      if: runner.environment == 'github-hosted' && inputs.coverage == 'true'
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: nightly-2026-08-06
        components: llvm-tools-preview
    - name: Cache Rust compilation
      if: runner.environment == 'github-hosted'
      uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      with:
        shared-key: ci-${{ runner.os }}-${{ inputs.coverage }}
        cache-on-failure: true
    - name: Install just
      if: runner.environment == 'github-hosted'
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
      with:
        tool: just
    - name: Install security audit tool
      if: runner.environment == 'github-hosted' && inputs.quality == 'true'
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
      with:
        tool: cargo-audit
    - name: Install branch-coverage tool
      if: runner.environment == 'github-hosted' && inputs.coverage == 'true'
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
      with:
        tool: cargo-llvm-cov
    - name: Log Rust versions
      shell: bash
      run: rustc -V && cargo -V
