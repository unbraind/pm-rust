version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      # Every pm-github workflow caller in this repository moves in one pull request, on one reviewed release.
      pm-github-workflows:
        patterns:
          - "unbraind/pm-github/*"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /tests/oracle
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
