[package]
name = "pm-rust"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.90"
description = "Independent Rust-native implementation of public pm workspace contracts"
license = "MIT"
repository = "https://github.com/unbraind/pm-rust"
keywords = ["agents", "cli", "project-management", "rust"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[lib]
name = "pm_rust"
path = "src/lib.rs"

[[bin]]
name = "pm-rust"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
toon-format = { version = "0.5.0", default-features = false }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
proptest = "1.9.0"
serde_yaml_ng = "0.10.0"
tempfile = "3.23.0"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
